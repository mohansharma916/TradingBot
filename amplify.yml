version: 1
applications:
  - appRoot: apps/trader
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@10.13.1 --activate
            - cd ../..
            - pnpm install --frozen-lockfile=false
            - pnpm --filter @trading-bot/contracts build
            - pnpm --filter @trading-bot/domain build
            - pnpm --filter @trading-bot/ui build
            - pnpm --filter @trading-bot/client-sdk build
            - cd apps/trader
        build:
          commands:
            - env | grep -e EXPO_PUBLIC_ >> .env || true
            - pnpm build:web
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - ../../.pnpm-store/**/*
          - ../../node_modules/**/*
          - node_modules/**/*
