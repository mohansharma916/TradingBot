syntax = "proto3";

package com.upstox.marketdatafeeder.rpc.proto;

enum Type {
  initial_feed = 0;
  live_feed = 1;
}

message LTPC {
  double ltp = 1;
  int64 ltt = 2;
  int64 ltq = 3;
  double cp = 4;
}

message Quote {
  int32 bq = 1;
  double bp = 2;
  int32 b_orders = 3;
  int32 aq = 4;
  double ap = 5;
  int32 a_orders = 6;
}

message MarketLevel {
  repeated Quote bidAskQuote = 1;
}

message MarketOHLC {
  string ohlc = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  int64 ts = 6;
}

message FullFeed {
  MarketOHLC marketOHLC = 1;
  MarketLevel marketLevel = 2;
  double ltp = 3;
  int64 ltt = 4;
  int64 ltq = 5;
  double cp = 6;
  int64 vtt = 7;
  double atp = 8;
  double oi = 9;
  double change = 10;
}

message Feed {
  oneof FeedUnion {
    LTPC ltpc = 1;
    FullFeed fullFeed = 2;
  }
}

message FeedResponse {
  Type type = 1;
  map<string, Feed> feeds = 2;
  int64 currentTs = 3;
}
