
name: fo-trading

services:

  # ---------------------------------
  # PostgreSQL Database
  # ---------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-trading_bot}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - internal

  # ---------------------------------
  # NestJS API
  # ---------------------------------
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile

    container_name: fo-api
    restart: unless-stopped

    env_file:
      - ../../.env.production

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      STATE_DIRECTORY: /app/.data

    volumes:
      - api_state:/app/.data

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"

    ports:
      - "3000:3000"

    networks:
      - internal
      - outbound

  # ---------------------------------
  # Trading Strategy Worker
  # ---------------------------------
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile

    container_name: fo-worker
    restart: unless-stopped

    env_file:
      - ../../.env.production

    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      TRADING_API_URL: http://api:3000/api/v1

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - internal
      - outbound

  # ---------------------------------
  # HTTPS Reverse Proxy
  # ---------------------------------
  caddy:
    image: caddy:2
    container_name: fo-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - api

    networks:
      - outbound

volumes:
  postgres_data:
  api_state:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true

  outbound:
    driver: bridge
